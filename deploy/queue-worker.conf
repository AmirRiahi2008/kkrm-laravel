[program:kkrm-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/kkrm/artisan queue:work --tries=3 --timeout=60 --max-time=3600
directory=/var/www/kkrm
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/kkrm/storage/logs/queue-worker.log
stopwaitsecs=120
